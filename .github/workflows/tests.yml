name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pre-push safety/privacy check
        run: python3 pre_push_check.py --allow-untracked
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
